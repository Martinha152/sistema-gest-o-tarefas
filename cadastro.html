<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Autenticação - DevOps</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Formulário de Cadastro -->
        <div class="form-box" id="cadastro-form">

            <h2>Cadastro</h2>

            <form id="formCadastro">

                 <div class="input-group">
                    <label for="Nome Completo">Nome</label>
                    <input type="text" id="nome-cadastro">
                </div>

                <form id="formCadastro">
                 <div class="input-group">
                    <label for="CPF">CPF</label>
                    <input type="text" id="cpf-cadastro">
                </div>

                <form id="formCadastro">
                 <div class="input-group">
                    <label for="Endereço">Endereço</label>
                    <input type="text" id="endereço-cadastro">
                </div>

                <form id="formCadastro">
                 <div class="input-group">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone-cadastro">
                </div>

                <div class="input-group">
                    <label for="cadastro-email">E-mail</label>
                    <input type="email" id="cadastro-email" required placeholder="seu@email.com">
                </div>

                <div class="input-group">
                    <label for="cadastro-senha">Senha</label>
                    <input type="password" id="cadastro-senha" required placeholder="******">
                </div>

                 <div class="input-group">
                    <label for="cadastro-senha2">Confirme sua senha</label>
                    <input type="password" id="cadastro-senha2" required placeholder="******">
                </div>

                <button type="submit" class="btn">Confirmar</button>

            </form>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
