<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Autenticação - DevOps</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Formulário de Login (Acesso) -->
        <div class="form-box" id="login-form">
            <h2>Acesso ao Sistema</h2>
            <form id="formLogin">
                <div class="input-group">
                    <label for="login-email">E-mail</label>
                    <input type="email" id="login-email" required placeholder="seu@email.com">
                </div>
                <div class="input-group">
                    <label for="login-senha">Senha</label>
                    <input type="password" id="login-senha" required placeholder="******">
                </div>
                <button type="submit" class="btn">Entrar</button>
            </form>
            <p class="switch-text">
                Não tem uma conta? <a href="#" onclick="alternarFormulario('cadastro')">Cadastre-se</a>
            </p>
        </div>

        <!-- Formulário de Cadastro -->
        <div class="form-box hidden" id="cadastro-form">
            <h2>Criar Conta</h2>
            <form id="formCadastro">
                <div class="input-group">
                    <label for="cad-nome">Nome Completo</label>
                    <input type="text" id="cad-nome" required placeholder="Seu Nome">
                </div>
                <div class="input-group">
                    <label for="cad-email">E-mail</label>
                    <input type="email" id="cad-email" required placeholder="seu@email.com">
                </div>
                <div class="input-group">
                    <label for="cad-senha">Senha</label>
                    <input type="password" id="cad-senha" required placeholder="******">
                </div>
                <button type="submit" class="btn">Cadastrar</button>
            </form>
            <p class="switch-text">
                Já tem uma conta? <a href="#" onclick="alternarFormulario('login')">Faça Login</a>
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
