<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Autenticação - DevOps</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Formulário de Login (Acesso) -->
        <div class="form-box" id="login-form">
            <h2>Entrar no Sistema (Acesso)</h2>
            <form id="formLogin">
                <div class="input-group">
                    <label for="login-email">E-mail</label>
                    <input type="email" id="login-email" required placeholder="seu@email.com">
                </div>
                <div class="input-group">
                    <label for="login-senha">Senha</label>
                    <input type="password" id="login-senha" required placeholder="******">
                </div>
                <button type="submit" class="btn">Entrar</button>
            </form>
            <p class="switch-text">
                Não tem uma conta? <a href="cadastro.html" onclick="alternarFormulario('cadastro')">Cadastre-se</a>
            </p>
        </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
